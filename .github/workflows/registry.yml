name: registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "right_tool/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/triage.*"
      - "docs/atlas.html"
      - "docs/*.svg"
      - "docs/evidence-policy.md"
      - "scripts/validate_registry.py"
      - "scripts/audit_evidence.py"
      - "scripts/sync_package_registry.py"
      - "scripts/generate_triage.py"
      - "scripts/generate_atlas.mjs"
      - "requirements-dev.txt"
      - ".github/workflows/registry.yml"
      - ".github/workflows/evidence-audit.yml"
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "right_tool/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/triage.*"
      - "docs/atlas.html"
      - "docs/*.svg"
      - "docs/evidence-policy.md"
      - "scripts/validate_registry.py"
      - "scripts/audit_evidence.py"
      - "scripts/sync_package_registry.py"
      - "scripts/generate_triage.py"
      - "scripts/generate_atlas.mjs"
      - "requirements-dev.txt"
      - ".github/workflows/registry.yml"
      - ".github/workflows/evidence-audit.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/validate_registry.py
      - run: python scripts/audit_evidence.py
      - run: python scripts/sync_package_registry.py
      - run: python scripts/generate_triage.py
      - run: node scripts/generate_atlas.mjs
      - run: git diff --exit-code -- right_tool/data/registry.json docs/triage.mmd docs/triage.md docs/atlas.html docs/triage.svg docs/capability-topology.svg docs/boundary-depth.svg
      - run: python -m unittest discover -s tests -v
      - run: right-tool find "worklist propagation until convergence" --json > /dev/null
