name: registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "docs/triage.*"
      - "docs/atlas.html"
      - "docs/*.svg"
      - "scripts/validate_registry.py"
      - "scripts/generate_triage.py"
      - "scripts/generate_atlas.mjs"
      - "requirements-dev.txt"
      - ".github/workflows/registry.yml"
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "docs/triage.*"
      - "docs/atlas.html"
      - "docs/*.svg"
      - "scripts/validate_registry.py"
      - "scripts/generate_triage.py"
      - "scripts/generate_atlas.mjs"
      - "requirements-dev.txt"
      - ".github/workflows/registry.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python scripts/validate_registry.py
      - run: python scripts/generate_triage.py
      - run: node scripts/generate_atlas.mjs
      - run: git diff --exit-code -- docs/triage.mmd docs/triage.md docs/atlas.html docs/triage.svg docs/capability-topology.svg docs/boundary-depth.svg
