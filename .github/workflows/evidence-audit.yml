name: evidence-audit

on:
  schedule:
    - cron: "17 13 1 * *"
  workflow_dispatch:

jobs:
  stale-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_evidence.py --strict-stale
